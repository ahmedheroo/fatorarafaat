<div class="page-header">
  <h1 class="page-title">{{ isEdit() ? 'تعديل مستخدم' : 'إضافة مستخدم' }}</h1>
  <a routerLink="/users" class="btn btn-secondary">العودة</a>
</div>
<div class="card" style="max-width:500px;padding:1.5rem">
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" [(ngModel)]="formData.username" name="username" required [readonly]="isEdit()">
    </div>
    <div class="form-group">
      <label>{{ isEdit() ? 'كلمة المرور الجديدة (اتركها فارغة لعدم التغيير)' : 'كلمة المرور' }}</label>
      <input type="password" [(ngModel)]="password" name="password" [required]="!isEdit()">
    </div>
    <div class="form-group">
      <label>الاسم</label>
      <input type="text" [(ngModel)]="formData.displayName" name="displayName" required>
    </div>
    <div class="form-group">
      <label>الدور</label>
      <select [(ngModel)]="formData.role" name="role">
        <option value="admin">مدير</option>
        <option value="cashier">كاشير</option>
      </select>
    </div>
    <div class="form-actions" style="display:flex;gap:1rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary btn-lg">{{ isEdit() ? 'حفظ' : 'إضافة' }}</button>
      <a routerLink="/users" class="btn btn-secondary btn-lg">إلغاء</a>
    </div>
  </form>
</div>
