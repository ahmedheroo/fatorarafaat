<div class="page-header">
  <h1 class="page-title">الإعدادات</h1>
</div>
<div class="card" style="max-width:700px;padding:1.5rem">
  <form (ngSubmit)="onSave()">
    <div class="form-group">
      <label>اسم المحل</label>
      <input type="text" [(ngModel)]="formData.shopName" name="shopName" required>
    </div>
    <div class="form-group">
      <label>شعار المحل</label>
      <div class="logo-actions">
        <input #logoFile type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
               (change)="onLogoSelected($event)" hidden>
        <button type="button" class="btn btn-secondary" (click)="logoFile.click()" [disabled]="logoUploading">
          <i class="fas" [class.fa-upload]="!logoUploading" [class.fa-spinner]="logoUploading" [class.fa-spin]="logoUploading"></i>
          {{ logoUploading ? 'جاري رفع الشعار...' : (formData.logoUrl ? 'تغيير الشعار' : 'رفع شعار') }}
        </button>
        @if (formData.logoUrl) {
          <button type="button" class="btn btn-danger btn-sm" (click)="onRemoveLogo()" [disabled]="logoUploading">
            <i class="fas fa-trash-alt"></i> إزالة الشعار
          </button>
        }
      </div>
      @if (formData.logoUrl) {
        <div class="logo-preview">
          <img [src]="formData.logoUrl" alt="شعار المحل" (error)="logoError = true" [style.display]="logoError ? 'none' : 'block'">
          @if (logoError) {
            <p class="logo-error">تعذر عرض الصورة</p>
          }
        </div>
      }
      <small class="field-hint" style="display:block;margin-top:0.35rem;color:#6b7280;font-size:0.8rem">
        اختر صورة من جهازك (PNG أو JPG أو WEBP). الصور الكبيرة تُصغَّر تلقائياً.
      </small>
    </div>
    <div class="form-group">
      <label>عنوان المحل</label>
      <input type="text" [(ngModel)]="formData.address" name="address">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="text" [(ngModel)]="formData.phone" name="phone">
      </div>
      <div class="form-group">
        <label>عرض الفاتورة</label>
        <select [(ngModel)]="formData.receiptWidth" name="receiptWidth">
          <option value="58mm">58 مم</option>
          <option value="80mm">80 مم</option>
        </select>
      </div>
    </div>

    <hr style="margin:1.5rem 0;border:none;border-top:1px solid #e5e7eb">
    <h3 style="margin-bottom:1rem">الفروع</h3>

    @for (branch of formData.branches; track branch.id; let i = $index) {
      <div class="branch-row">
        <div class="branch-info">
          <input type="text" [(ngModel)]="branch.name" [name]="'branch-name-' + i" placeholder="اسم الفرع" class="branch-name-input">
          <input type="text" [(ngModel)]="branch.address" [name]="'branch-addr-' + i" placeholder="عنوان الفرع" class="branch-addr-input">
        </div>
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="branch.isActive" [name]="'branch-active-' + i">
          <span class="toggle-slider"></span>
          <span class="toggle-text">تفعيل</span>
        </label>
        <button type="button" class="btn btn-danger btn-sm" (click)="removeBranch(i)"><i class="fas fa-trash-alt"></i></button>
      </div>
    }

    <button type="button" class="btn btn-secondary" (click)="addBranch()" style="margin-top:0.75rem"><i class="fas fa-plus"></i> فرع جديد</button>

    <button type="submit" class="btn btn-primary btn-lg" style="margin-top:1.5rem"><i class="fas fa-save"></i> حفظ الإعدادات</button>
  </form>
</div>
